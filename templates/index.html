<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>HackRF UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.css') }}">
  <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.js') }}"></script>
  <script>
    function parseHackrfInfo(rawText) {
      // The main object to be returned
      const result = {
        devices: []
      };

      // Split the entire output by "Found HackRF".
      // The first element is the header, the rest are device blocks.
      const blocks = rawText.trim().split('Found HackRF');
      const headerBlock = blocks.shift(); // Removes and returns the first element

      // --- 1. Parse the Header/Root Block ---
      headerBlock.trim().split('\n').forEach(line => {
        const colonIndex = line.indexOf(':');
        if (colonIndex > -1) {
          const key = line.substring(0, colonIndex).trim();
          const value = line.substring(colonIndex + 1).trim();
          result[key] = value;
        }
      });

      // --- 2. Parse Each Device Block ---
      blocks.forEach(block => {
        const deviceObject = {};
        const lines = block.trim().split('\n');

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const colonIndex = line.indexOf(':');

          if (colonIndex > -1) {
            const key = line.substring(0, colonIndex).trim();
            let value = line.substring(colonIndex + 1).trim();

            // If the value is empty, the actual value is on the next line
            if (value === '' && (i + 1) < lines.length) {
              value = lines[i + 1].trim();
              i++; // Increment i to skip the next line in the next iteration
            }

            deviceObject[key] = value;
          }
        }

        // Add the fully parsed device object to the devices array
        if (Object.keys(deviceObject).length > 0) {
          result.devices.push(deviceObject);
        }
      });

      return result;
    }

    function displayHackrfInfo(data, elementId) {
      const targetElement = document.getElementById(elementId);
      if (!targetElement) {
        console.error(`Element with ID "${elementId}" not found.`);
        return;
      }

      let htmlString = '<h3>System Information</h3>';

      // Display root-level info (excluding the 'devices' array)
      for (const key in data) {
        if (key !== 'devices') {
          htmlString += `<strong>${key}:</strong> ${data[key]}<br>`;
        }
      }

      // Display each device in its own formatted block
      data.devices.forEach((device, index) => {
        htmlString += `<div class="device-block">`;
        htmlString += `<h3>Device ${index + 1}</h3>`;
        for (const key in device) {
          htmlString += `<strong>${key}:</strong> ${device[key]}<br>`;
        }
        htmlString += `</div>`;
      });

      targetElement.innerHTML = htmlString;
    }
  </script>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">HackRF UI</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="/settings">Settings</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <br />

  <div class="accordion" id="hackrfInfoAccord">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne"
          aria-expanded="true" aria-controls="collapseOne">
          HackRF(s) Info
        </button>
      </h2>
      <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#hackrfInfoAccord">
        <div class="accordion-body">
          <a onclick="hackrfRefresh()" class="btn btn-primary">Refresh ⟳</a><br />
          <p class="card-text" id="hackrf-info">No info available, refresh to update.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function hackrfRefresh() {
      const outputElem = document.getElementById('hackrf-info');
      outputElem.textContext = 'Running command...';

      const response = await fetch('/api/hackrf-info');
      const data = await response.json();

      const parsedData = parseHackrfInfo(data.output);
      displayHackrfInfo(parsedData, 'hackrf-info');
    }
  </script>


</body>

</html>
